<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="light">

<head>
  <meta charset="UTF-8">
  <title>Consulta de Folha de Processo</title>
  <link rel="icon" type="image/svg+xml" href="/static/images/Logo_P_Produza.svg">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@600&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: "Georgia", "Monaco", sans-serif;
      background: var(--bs-secondary-bg);
      min-height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
    }

    /* Botão de tema (canto superior direito) */
    .theme-toggle {
      position: fixed;
      top: 15px;
      right: 15px;
      z-index: 1000;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      font-size: 20px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .content {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg,  #F08522 0%, #00578D 100%);
      padding: 40px 0;
    }

    .logo {
      display: block;
      margin: 0 auto 18px;
      max-width: 220px;
      height: auto;
    }

    .container {
      background: var(--bs-body-bg);
      color: var(--bs-body-color);
      padding: 25px;
      width: 100%;
      max-width: 500px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
    }

    h1 {
      font-family: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
      font-weight: 600;
      text-align: center;
      margin-bottom: 20px;
    }

    iframe {
      width: 100%;
      height: 600px;
      margin-top: 20px;
      border: 1px solid var(--bs-border-color);
      display: none;
    }

    @media (max-width: 600px) {
      iframe {
        height: 400px;
      }
    }

    .version {
      position: fixed;
      bottom: 10px;
      right: 10px;
      font-size: 11px;
      color: var(--bs-secondary-color);
      opacity: 0.4;
      z-index: 999;
    }
  </style>
</head>

<body>

  <!-- Botão de tema -->
  <button id="toggleTheme" class="btn btn-outline-secondary theme-toggle" title="Alternar tema">
    🌙
  </button>

  <div class="content">
    <div class="container">
    <div class="d-flex justify-content-end align-items-center gap-2 mb-2">
      <span id="currentUser" class="small text-body-secondary"></span>
      <a href="/logout" class="btn btn-sm btn-outline-secondary">Sair</a>
    </div>
    <img src="/static/images/Logo_P_Produza.svg" alt="Produza" class="logo">
    <h1>Consultar Folha</h1>

      <input type="text" id="serial" class="form-control mt-2" placeholder="Digite a OF ou código do produto" autofocus>

      <button class="btn btn-primary mt-3 w-100" onclick="buscar()">Buscar</button>

      <div id="message" class="mt-3 text-center fw-bold"></div>

      <iframe id="pdfViewer"></iframe>
    </div>
  </div>

  <script src="/static/script.js"></script>

</body>
</html>
