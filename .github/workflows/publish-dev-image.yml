name: Publish development image

on:
  pull_request:
    branches:
      - dev
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-dev-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-test-publish:
    name: Build, test and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test authentication and authorization
        shell: bash
        run: |
          docker run --rm \
            --env PYTHONDONTWRITEBYTECODE=1 \
            --volume "${PWD}:/app:ro" \
            --workdir /app \
            python:3.12-slim-bookworm \
            sh -ec 'python -m pip install --disable-pip-version-check -r requirements-dev.txt && pytest -q -p no:cacheprovider'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build image for smoke test
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile
          load: true
          push: false
          tags: leitor-folha-processos-ci:${{ github.sha }}
          cache-from: type=gha,scope=dev
          cache-to: type=gha,mode=max,scope=dev

      - name: Smoke test health endpoint
        shell: bash
        run: |
          set -euo pipefail

          container_name="leitor-folha-processos-ci"
          image_name="leitor-folha-processos-ci:${GITHUB_SHA}"

          cleanup() {
            docker logs "${container_name}" || true
            docker rm --force "${container_name}" || true
          }
          trap cleanup EXIT

          docker run \
            --detach \
            --name "${container_name}" \
            --publish 127.0.0.1:8000:8000 \
            "${image_name}"

          for attempt in {1..30}; do
            if curl --fail --silent --show-error \
              http://127.0.0.1:8000/healthz; then
              exit 0
            fi
            sleep 2
          done

          echo "The application did not become healthy in time." >&2
          exit 1

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        if: github.event_name != 'pull_request'
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short,prefix=dev-

      - name: Build and publish image
        if: github.event_name != 'pull_request'
        id: publish
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=dev
          cache-to: type=gha,mode=max,scope=dev
          provenance: true
          sbom: true

      - name: Record published image
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          echo "## Development image" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Tag: \`${{ steps.metadata.outputs.tags }}\`" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Digest: \`${{ steps.publish.outputs.digest }}\`" >> "${GITHUB_STEP_SUMMARY}"
