services:
  leitor-folha-processos:
    build:
      context: ..
      dockerfile: docker/Dockerfile

    env_file:
      - ../.env

    expose:
      - "8000"

    restart: unless-stopped

    volumes:
      # Compartilhamento CIFS montado no host
      # Somente leitura para maior segurança
      - type: bind
        source: /mnt/boro_documentacao_geral
        target: /mnt/boro_documentacao_geral
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  proxy:
    external: true
