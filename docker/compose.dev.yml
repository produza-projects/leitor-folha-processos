name: leitor-folha-processos-dev

services:
  leitor-folha-processos:
    image: leitor-folha-processos-dev
    networks:
      - proxy
      - auth
      - database
    labels:
      - traefik.enable=true
      - traefik.environment=dev
      - traefik.docker.network=server-infra-dev_proxy
      - traefik.http.routers.leitor-folha-processos.rule=Host(`fp-dev.produza.ind.br`)
      - traefik.http.routers.leitor-folha-processos.entrypoints=websecure
      - traefik.http.routers.leitor-folha-processos.tls=true
      - traefik.http.routers.leitor-folha-processos.service=leitor-folha-processos
      - traefik.http.routers.leitor-folha-processos.middlewares=security-headers@file
      - traefik.http.services.leitor-folha-processos.loadbalancer.server.port=8000

networks:
  proxy:
    external: true
    name: server-infra-dev_proxy
  database:
    external: true
    name: server-infra-dev_database
  auth:
    external: true
    name: server-infra-dev_auth
