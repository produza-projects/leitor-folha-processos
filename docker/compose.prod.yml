name: leitor-folha-processos-prod

services:
  leitor-folha-processos:
    image: leitor-folha-processos
    networks:
      - proxy
      - auth
      - database
    labels:
      # Produção permanece deliberadamente fora do Traefik até a definição do
      # hostname, DNS e certificado definitivos no server-infra.
      - traefik.enable=false
      - traefik.environment=prod

networks:
  proxy:
    external: true
    name: server-infra-prod_proxy
  database:
    external: true
    name: server-infra-prod_database
  auth:
    external: true
    name: server-infra-prod_auth
